spring.application.name=vidanimal
server.port=8080

# Configuración para PostgreSQL (Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always

# Notificaciones de adopción vía Resend API (HTTP por puerto 443).
# Render bloquea los puertos SMTP salientes (25/465/587) en el plan gratuito,
# por eso se usa la API HTTP de Resend en lugar de SMTP.
# El envío es asíncrono (emailExecutor): nunca bloquea la petición de adopción.
#   RESEND_API_KEY=<api key de https://resend.com/api-keys>
#   RESEND_FROM=<remitente verificado en Resend, p. ej. notificaciones@ayudaanimalmurcia.org>
#   EMAIL_DESTINO=ayudaanimalm@gmail.com
adopcion.mail.resend-api-key=${RESEND_API_KEY:}
adopcion.mail.from=${RESEND_FROM:}
adopcion.mail.destination=${EMAIL_DESTINO:}
adopcion.mail.dashboard-url=${DASHBOARD_URL:https://www.ayudaanimalmurcia.org/dashboard/adopciones}
acogida.mail.dashboard-url=${DASHBOARD_URL_ACOGIDA:https://www.ayudaanimalmurcia.org/dashboard/acogidas}
