spring.application.name=vidanimal

# Puerto del servidor
server.port=8080

# Base de datos MySQL
# En produccion las credenciales se inyectan mediante variables de entorno:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# Conexión leída desde las variables de Render
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver explícito de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate
# ddl-auto=update solo para desarrollo. En produccion cambiar a validate.
# show-sql=true util en desarrollo, desactivar en produccion.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true